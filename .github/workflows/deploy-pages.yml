# Builds the app and publishes it to GitHub Pages. Run it from the Actions tab; to publish on every
# push instead, add `push: { branches: [main] }` under `on:` (the AWS workflow already does that).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Project pages are served from /<repo-name>/; a custom domain or <user>.github.io repo uses "/".
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links still load the app.
      - run: cp dist/resume-studio/browser/index.html dist/resume-studio/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/resume-studio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
